# Secrets created by the chart from inline values (trials only). Used by CI.
# apiKey.existingSecret keeps its default: an inline value must still win over it.
apiKey:
  value: ci-only-api-key-0123456789abcdefghijklmnop
persistence:
  mode: jdbc
  jdbc:
    url: jdbc:postgresql://postgres:5432/nexora?user=nexora&password=ci-only
