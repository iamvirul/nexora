{{- if include "nexora.createSecret" . }}
# Created only for values given inline (apiKey.value, persistence.jdbc.url). Prefer existing Secrets.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nexora.secretName" . }}
  labels:
    {{- include "nexora.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if and (not .Values.apiKey.existingSecret) .Values.apiKey.value }}
  {{ .Values.apiKey.secretKey }}: {{ .Values.apiKey.value | b64enc | quote }}
  {{- end }}
  {{- if and (eq .Values.persistence.mode "jdbc") (not .Values.persistence.jdbc.existingSecret) .Values.persistence.jdbc.url }}
  {{ .Values.persistence.jdbc.secretKey }}: {{ .Values.persistence.jdbc.url | b64enc | quote }}
  {{- end }}
{{- end }}
