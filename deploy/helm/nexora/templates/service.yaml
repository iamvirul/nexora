apiVersion: v1
kind: Service
metadata:
  name: {{ include "nexora.fullname" . }}
  labels:
    {{- include "nexora.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  sessionAffinity: {{ .Values.service.sessionAffinity }}
  selector:
    {{- include "nexora.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.httpPort }}
      targetPort: http
      protocol: TCP
    - name: websocket
      port: {{ include "nexora.websocketPort" . }}
      targetPort: websocket
      protocol: TCP
