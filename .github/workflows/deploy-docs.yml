name: Deploy Docusaurus site to Pages

on:
  push:
    branches:
      - main
    paths:
      - 'website/**'
      # The site publishes the observe server's OpenAPI document (website/scripts/copy-openapi.mjs).
      - 'nexora-cli/src/main/resources/openapi.yaml'
      - '.github/workflows/deploy-docs.yml'

  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Docusaurus
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: website/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build website
        run: npm run build

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: temurin
      - name: Build JavaDoc of the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! TAG=$(gh release view --json tagName --jq .tagName 2>&1); then
            if [ "$TAG" = "release not found" ]; then
              echo "::warning::No published release yet; the site is deployed without JavaDoc"
              exit 0
            fi
            echo "::error::Could not look up the latest release: ${TAG}"
            exit 1
          fi
          echo "Building JavaDoc for ${TAG}"
          scripts/build-javadoc.sh "$TAG" build/javadoc
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/build

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
