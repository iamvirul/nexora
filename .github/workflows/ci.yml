name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, advance-implementation]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Run unit tests
        run: mvn verify -DskipITs --no-transfer-progress

      # Tests tagged "integration" (Testcontainers, e.g. PostgreSQL). Docker is preinstalled on ubuntu-latest.
      - name: Run integration tests
        timeout-minutes: 3
        run: mvn verify -DskipUTs --no-transfer-progress

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/*.xml
            **/target/failsafe-reports/*.xml
          retention-days: 7
