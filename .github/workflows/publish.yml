name: Publish

# Publishes the library modules to Maven Central under me.virul.nexora for a release tag, then creates
# the GitHub Release. The modules published are those the root pom's release profile does not
# exclude; nexora-all is the BOM listing them.
#
# Two ways to release:
#   - push a v* tag: that commit is built and published.
#   - run it from the Actions tab on main with a tag name. An existing tag is built as is (a re-run);
#     a new one is created on the main commit built, only after Central accepts the upload, and the
#     container image workflow is started for it (tags created by this workflow trigger nothing).
#
# Secrets:
#   CENTRAL_USERNAME, CENTRAL_TOKEN  a user token generated at central.sonatype.com (Account > Generate User Token)
#   GPG_PRIVATE_KEY                  the ASCII-armored private signing key, its public key on keys.openpgp.org
#   GPG_PASSPHRASE                   that key's passphrase
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.5.0). Created on main if it does not exist yet."
        required: true

permissions:
  contents: read

# A version can be published to Central only once; never run two publishes of one tag together.
concurrency:
  group: publish-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    permissions:
      contents: write

    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      new-tag: ${{ steps.tag.outputs.new-tag }}

    steps:
      - name: Resolve release tag and source
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${INPUT_TAG:-$GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Not a release tag (vMAJOR.MINOR.PATCH[-suffix]): ${TAG}"
            exit 1
          fi
          # matching-refs is a prefix match (v0.5.0 also matches v0.5.0-rc.1), so compare exactly.
          if gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/${TAG}" --jq '.[].ref' \
              | grep -qx "refs/tags/${TAG}"; then
            echo "Tag ${TAG} exists: publishing it."
            REF="refs/tags/${TAG}"
            NEW_TAG=false
          elif [ "$GITHUB_REF" = "refs/heads/main" ]; then
            echo "Tag ${TAG} does not exist: publishing main at ${GITHUB_SHA}; the tag is created there after the upload."
            REF="$GITHUB_SHA"
            NEW_TAG=true
          else
            echo "::error::Tag ${TAG} does not exist. Run this workflow from main to create it, or push the tag."
            exit 1
          fi
          {
            echo "tag=${TAG}"
            echo "version=${TAG#v}"
            echo "ref=${REF}"
            echo "new-tag=${NEW_TAG}"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ steps.tag.outputs.ref }}

      # No dependency cache here: this job signs and publishes artifacts, and a cache other runs can
      # write could put a tampered dependency into them.
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: temurin
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_TOKEN

      - name: Check publishing secrets
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          missing=()
          for name in CENTRAL_USERNAME CENTRAL_TOKEN GPG_PRIVATE_KEY GPG_PASSPHRASE; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repository secrets: ${missing[*]}. See CONTRIBUTING.md, Releases."
            exit 1
          fi

      - name: Set release version in pom
        env:
          NEW_VERSION: ${{ steps.tag.outputs.version }}
        run: |
          mvn -B -q versions:set -DnewVersion="${NEW_VERSION}" -DgenerateBackupPoms=false
          # versions:set updates <version> elements but not the nexora-*.version properties in the
          # parent pom; patch those explicitly.
          sed -i "s|<nexora-\(.*\)\.version>[^<]*</nexora-\1\.version>|<nexora-\1.version>${NEW_VERSION}</nexora-\1.version>|g" pom.xml
          # Central refuses SNAPSHOT dependencies, so fail here rather than after the upload.
          if grep -rl --include=pom.xml -- "-SNAPSHOT" .; then
            echo "::error::SNAPSHOT versions remain in the files above"
            exit 1
          fi

      # One run builds, tests (unit and integration), signs and uploads. The upload is a single
      # bundle, published only after Central validates every module in it, so a failure never leaves
      # half a release on Central.
      - name: Build, test and publish
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
          MAVEN_GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: mvn -B -ntp -P release deploy

      # ── GitHub Release ───────────────────────────────────────────────────────
      - name: Extract release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          NOTES=$(awk -v v="$VERSION" 'index($0, "## [" v "]") == 1 {found=1; next} found && /^## /{exit} found{print}' CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            NOTES=$(awk '/^## \[Unreleased\]/{found=1; next} found && /^## /{exit} found{print}' CHANGELOG.md)
          fi
          if [ -z "$NOTES" ]; then
            NOTES="Release ${TAG}"
          fi
          printf '%s\n' "$NOTES" > release-notes.txt

      # The library jars as built for Central, the CLI jar the container image runs, and the LLM
      # planner plugin jar to drop into a plugins directory. A new tag is created here, on the commit
      # built, so a run that fails earlier leaves no tag behind.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: "Nexora ${{ steps.tag.outputs.tag }}"
          body_path: release-notes.txt
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.tag, '-') }}
          files: |
            nexora-*/target/*-${{ steps.tag.outputs.version }}.jar
            nexora-cli/target/nexora.jar
            nexora-planner-llm/target/*-plugin.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Container image for a tag this workflow created ─────────────────────────
  # A tag pushed by a person starts the Container image workflow itself; one created with
  # GITHUB_TOKEN does not, so start it here.
  trigger-image:
    name: Trigger container image build
    needs: publish
    if: needs.publish.outputs.new-tag == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Invoke container image workflow
        uses: actions/github-script@v9
        env:
          RELEASED_TAG: ${{ needs.publish.outputs.tag }}
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'docker.yml',
              ref: 'main',
              inputs: {
                tag: process.env.RELEASED_TAG
              }
            });

  # ── Post-release: open version-bump PR ──────────────────────────────────────
  trigger-version-bump:
    name: Trigger next SNAPSHOT version bump PR
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Invoke bump-version workflow
        uses: actions/github-script@v9
        env:
          RELEASED_TAG: ${{ needs.publish.outputs.tag }}
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'bump-version.yml',
              ref: 'main',
              inputs: {
                released_tag: process.env.RELEASED_TAG
              }
            });
